<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" id="telaPedidos" th:attr="data-perfil=${perfilLogado}">

    <div class="cabecalho-pagina">
        <div>
            <h1>Pedidos</h1>
            <p>Acompanhe a fila, avance etapas e trate exceções.</p>
        </div>
        <button class="btn btn-primary" id="btnNovoPedido" data-bs-toggle="modal" data-bs-target="#modalNovo">
            <i class="bi bi-plus-lg me-1"></i>Novo pedido
        </button>
    </div>

    <div class="painel mb-3">
        <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between">
            <div class="chips" id="chipsStatus" role="tablist" aria-label="Filtrar por situação"></div>
            <div class="d-flex gap-2">
                <input type="search" class="form-control form-control-sm" id="busca" placeholder="Buscar cliente ou produto…" style="min-width:220px" aria-label="Buscar">
                <button class="btn btn-suave btn-sm" id="btnRecarregar" title="Recarregar"><i class="bi bi-arrow-clockwise"></i></button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th class="ps-3">Pedido</th>
                    <th>Cliente</th>
                    <th>Itens</th>
                    <th class="text-end">Total</th>
                    <th>Situação</th>
                    <th>Entrada</th>
                    <th class="text-end pe-3">Ações</th>
                </tr>
                </thead>
                <tbody id="tbPedidos">
                <tr><td colspan="7" class="estado-vazio">Carregando…</td></tr>
                </tbody>
            </table>
        </div>
        <div class="d-flex justify-content-between align-items-center px-3 py-2 border-top small texto-3" style="border-color:var(--borda)!important">
            <span id="rodapeContagem"></span>
            <span id="rodapeSoma"></span>
        </div>
    </div>

    <!-- ===== Modal: novo pedido ===== -->
    <div class="modal fade" id="modalNovo" tabindex="-1" aria-labelledby="tituloNovo" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloNovo"><i class="bi bi-receipt me-2"></i>Novo pedido</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label" for="novoCliente">Cliente</label>
                    <select class="form-select mb-3" id="novoCliente"></select>
                    <label class="form-label">Itens</label>
                    <div class="row g-2" id="gradeProdutos"></div>
                </div>
                <div class="modal-footer justify-content-between">
                    <div><span class="texto-3 small">Total</span> <strong class="fs-5 num" id="novoTotal">R$ 0,00</strong></div>
                    <div>
                        <button type="button" class="btn btn-suave" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary" id="btnSalvarPedido">Registrar pedido</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== Modal: detalhes ===== -->
    <div class="modal fade" id="modalDetalhe" tabindex="-1" aria-labelledby="tituloDetalhe" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloDetalhe">Pedido</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body" id="corpoDetalhe"></div>
            </div>
        </div>
    </div>

    <!-- ===== Modal: desconto ===== -->
    <div class="modal fade" id="modalDesconto" tabindex="-1" aria-labelledby="tituloDesconto" aria-hidden="true">
        <div class="modal-dialog modal-sm">
            <form class="modal-content" id="formDesconto">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloDesconto"><i class="bi bi-percent me-2"></i>Conceder desconto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label" for="percDesconto">Percentual (0,01 a 20%)</label>
                    <input type="range" class="form-range" id="rangeDesconto" min="1" max="20" step="1" value="10">
                    <div class="input-group">
                        <input type="number" class="form-control" id="percDesconto" min="0.01" max="20" step="0.01" value="10" required>
                        <span class="input-group-text">%</span>
                    </div>
                    <div class="small texto-3 mt-2" id="previaDesconto"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-suave" data-bs-dismiss="modal">Voltar</button>
                    <button type="submit" class="btn btn-primary">Aplicar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== Modal: cancelamento ===== -->
    <div class="modal fade" id="modalCancelar" tabindex="-1" aria-labelledby="tituloCancelar" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content" id="formCancelar">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloCancelar"><i class="bi bi-x-octagon me-2 text-danger"></i>Cancelar pedido</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="chips mb-2" id="motivosRapidos">
                        <button type="button" class="chip">Cliente desistiu</button>
                        <button type="button" class="chip">Pedido duplicado</button>
                        <button type="button" class="chip">Endereço fora da área</button>
                        <button type="button" class="chip">Produto indisponível</button>
                    </div>
                    <label class="form-label" for="motivoCancelamento">Justificativa (obrigatória)</label>
                    <textarea class="form-control" id="motivoCancelamento" rows="3" required minlength="3"></textarea>
                    <div class="small texto-3 mt-2">A justificativa fica registrada na auditoria.</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-suave" data-bs-dismiss="modal">Voltar</button>
                    <button type="submit" class="btn btn-danger">Confirmar cancelamento</button>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        window.PP_CLIENTES = /*[[${clientes}]]*/ [];
        window.PP_PRODUTOS = /*[[${produtos}]]*/ [];
    </script>
    <script th:src="@{/js/pedidos.js}"></script>
</div>
</body>
</html>
