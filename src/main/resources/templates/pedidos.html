<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pedidos</title>
</head>
<body>

<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Gestão de Pedidos</h3>
    </div>

    <!-- Novo Pedido -->
    <div class="card mb-4">
        <div class="card-header bg-light">
            <strong>Novo Pedido</strong>
        </div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Cliente</label>
                    <select id="clienteSelect" class="form-select">
                        <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option>
                    </select>
                </div>
                <div class="col-md-8">
                    <label class="form-label">Itens</label>
                    <div class="row g-2">
                        <div class="col-sm-4" th:each="p : ${produtos}">
                            <div class="border rounded p-2 text-center bg-white">
                                <small class="d-block fw-semibold text-truncate" th:text="${p.nome}"></small>
                                <small class="text-muted d-block" th:text="${'R$ ' + p.preco}"></small>
                                <input type="number" min="0" value="0" class="form-control form-control-sm mt-1 item-qtd text-center" th:data-produto="${p.id}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="mt-3 text-end">
                <button type="button" class="btn btn-primary" onclick="salvarNovoPedido()">Registrar Pedido</button>
            </div>
        </div>
    </div>

    <!-- Tabela de Pedidos -->
    <div class="card">
        <div class="card-header bg-light">
            <strong>Histórico de Pedidos</strong>
        </div>
        <div class="table-responsive">
            <table class="table table-hover table-bordered mb-0 align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Cliente</th>
                        <th>Itens</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Entrada</th>
                        <th>Saída</th>
                        <th style="min-width: 220px;">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="7" class="text-center text-muted py-4">Nenhum pedido registrado.</td>
                    </tr>
                    <tr th:each="p : ${pedidos}">
                        <td th:text="${p.clienteNome}"></td>
                        <td>
                            <ul class="list-unstyled mb-0 small">
                                <li th:each="i : ${p.itens}" th:text="${i.quantidade + 'x ' + i.nomeProduto}"></li>
                            </ul>
                        </td>
                        <td>
                            <strong th:text="${'R$ ' + p.total}"></strong>
                            <span class="badge bg-secondary ms-1" th:if="${p.percentualDesconto > 0}" th:text="${p.percentualDesconto + '% desc.'}"></span>
                        </td>
                        <td>
                            <span class="badge bg-info text-dark" th:text="${p.status}"></span>
                            <div class="small text-danger" th:if="${p.justificativaCancelamento}" th:text="${'Motivo: ' + p.justificativaCancelamento}"></div>
                        </td>
                        <td class="small" th:text="${p.responsavelEntrada + ' em ' + #temporals.format(p.dataHoraEntrada, 'dd/MM/yyyy HH:mm')}"></td>
                        <td class="small" th:text="${p.dataHoraSaida != null ? (p.responsavelSaida + ' em ' + #temporals.format(p.dataHoraSaida, 'dd/MM/yyyy HH:mm')) : '-'}"></td>
                        <td>
                            <div class="input-group input-group-sm mb-1">
                                <select class="form-select form-select-sm" th:id="${'status-sel-' + p.id}">
                                    <option value="EM_PREPARACAO">EM_PREPARACAO</option>
                                    <option value="PRONTO">PRONTO</option>
                                    <option value="SAIU_PARA_ENTREGA">SAIU_PARA_ENTREGA</option>
                                    <option value="RETIRADO">RETIRADO</option>
                                    <option value="FINALIZADO">FINALIZADO</option>
                                </select>
                                <button class="btn btn-outline-primary" th:onclick="'alterarStatus(\'' + ${p.id} + '\')'">Mudar</button>
                            </div>
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-outline-warning" th:onclick="'concederDesconto(\'' + ${p.id} + '\')'">Desconto</button>
                                <button class="btn btn-outline-danger" th:onclick="'cancelarPedido(\'' + ${p.id} + '\')'">Cancelar</button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function salvarNovoPedido() {
            const clienteId = document.getElementById('clienteSelect').value;
            const itens = [];
            document.querySelectorAll('.item-qtd').forEach(input => {
                const qtd = parseInt(input.value, 10);
                if (qtd > 0) {
                    itens.push({ produtoId: input.dataset.produto, quantidade: qtd });
                }
            });

            if (itens.length === 0) {
                alert('Selecione ao menos 1 item para o pedido.');
                return;
            }

            fetch('/api/pedidos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ clienteId, itens })
            }).then(resp => {
                if (resp.ok) window.location.reload();
                else resp.text().then(t => alert('Erro ao registrar: ' + t));
            });
        }

        function alterarStatus(id) {
            const status = document.getElementById('status-sel-' + id).value;
            fetch('/api/pedidos/' + id + '/status?status=' + status, {
                method: 'PUT'
            }).then(resp => {
                if (resp.ok) window.location.reload();
                else alert('Transição não permitida');
            });
        }

        function concederDesconto(id) {
            const perc = prompt('Informe a taxa percentual de desconto (1 a 20):');
            if (!perc) return;
            fetch('/api/pedidos/' + id + '/desconto', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ percentual: parseFloat(perc) })
            }).then(resp => {
                if (resp.ok) window.location.reload();
                else alert('Falha ao conceder desconto');
            });
        }

        function cancelarPedido(id) {
            const justificativa = prompt('Informe a justificativa do cancelamento:');
            if (!justificativa) return;
            fetch('/api/pedidos/' + id + '/cancelar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ motivo: justificativa })
            }).then(resp => {
                if (resp.ok) window.location.reload();
                else alert('Falha ao cancelar o pedido');
            });
        }
    </script>
</div>

</body>
</html>
