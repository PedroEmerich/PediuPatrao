<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pediu Patrão · Painel</title>
    <!-- aplica o tema salvo antes de pintar a tela (evita "piscar" claro/escuro) -->
    <script>
        (function () {
            var t = null;
            try {
                t = localStorage.getItem('pp-tema');
                if (t) document.documentElement.setAttribute('data-theme', t);
            } catch (e) { }
            var escuro = (t || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
            document.documentElement.setAttribute('data-bs-theme', escuro ? 'dark' : 'light');
        })();
    </script>
        <link th:href="@{/vendor/fonts/fonts.css}" rel="stylesheet">
    <link th:href="@{/vendor/bootstrap/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/script.js}"></script>
</head>
<body>
<div class="app">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="sidebar-backdrop" data-acao="fechar-menu"></div>

    <div class="app-main">
        <header class="topbar">
            <button class="btn-icone d-lg-none" type="button" data-acao="abrir-menu" aria-label="Abrir menu">
                <i class="bi bi-list"></i>
            </button>
            <div class="topbar-titulo" id="topbarTitulo">Pediu Patrão</div>
            <div class="topbar-acoes">
                <button class="btn-icone" type="button" id="btnTema" aria-label="Alternar tema claro/escuro" title="Alternar tema">
                    <i class="bi bi-moon-stars"></i>
                </button>
                <div class="usuario-chip" th:if="${usuarioLogado}">
                    <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(usuarioLogado,0,1))}">A</span>
                    <span class="d-none d-sm-flex flex-column lh-1">
                        <strong th:text="${usuarioLogado}">admin</strong>
                        <small th:text="${perfilLogado}">ADMIN</small>
                    </span>
                </div>
            </div>
        </header>

        <main class="conteudo">
            <div th:replace="~{__${content}__}"></div>
        </main>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

</body>
</html>
