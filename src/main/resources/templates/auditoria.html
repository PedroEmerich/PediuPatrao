<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="cabecalho-pagina">
        <div>
            <h1>Auditoria</h1>
            <p>Quem fez o quê, quando — e o que mudou.</p>
        </div>
        <button class="btn btn-suave" id="btnCsvAud"><i class="bi bi-download me-1"></i>Exportar CSV</button>
    </div>

    <div class="kpis" id="kpisAud"></div>

    <div class="painel filtros">
        <div class="campo flex-grow-1">
            <label class="form-label" for="audBusca">Buscar</label>
            <input type="search" class="form-control" id="audBusca" placeholder="Usuário, entidade, justificativa…">
        </div>
        <div class="campo">
            <label class="form-label" for="audOperacao">Operação</label>
            <select class="form-select" id="audOperacao"><option value="">Todas</option></select>
        </div>
        <div class="campo">
            <label class="form-label" for="audUsuario">Usuário</label>
            <select class="form-select" id="audUsuario"><option value="">Todos</option></select>
        </div>
        <div class="campo">
            <label class="form-label" for="audData">Dia</label>
            <input type="date" class="form-control" id="audData">
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th class="ps-3">Quando</th>
                    <th>Usuário</th>
                    <th>Operação</th>
                    <th>Entidade</th>
                    <th>Alterações</th>
                    <th class="pe-3"></th>
                </tr>
                </thead>
                <tbody id="tbAud"><tr><td colspan="6" class="estado-vazio">Carregando…</td></tr></tbody>
            </table>
        </div>
        <div class="d-flex justify-content-between align-items-center px-3 py-2 small texto-3">
            <span id="audContagem"></span>
            <div class="btn-group btn-group-sm">
                <button class="btn btn-suave" id="audAnterior" aria-label="Página anterior"><i class="bi bi-chevron-left"></i></button>
                <button class="btn btn-suave" id="audProxima" aria-label="Próxima página"><i class="bi bi-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalAud" tabindex="-1" aria-labelledby="tituloAud" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloAud">Registro de auditoria</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body" id="corpoAud"></div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/auditoria.js}"></script>
</div>
</body>
</html>
