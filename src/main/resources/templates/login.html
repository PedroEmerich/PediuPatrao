<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar · Pediu Patrão</title>
    <link th:href="@{/vendor/fonts/fonts.css}" rel="stylesheet">
    <link th:href="@{/vendor/bootstrap/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .login { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
        .login-arte { background: radial-gradient(circle at 30% 20%, #f06a3f 0, #c0322b 45%, #1d1a17 100%); color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; }
        .login-arte h2 { color: #fff; font-size: 2.4rem; font-weight: 700; max-width: 420px; line-height: 1.1; }
        .login-arte p { color: rgba(255,255,255,.8); max-width: 380px; }
        .login-form { display: grid; place-items: center; padding: 32px 16px; background: var(--fundo); }
        .login-card { width: 100%; max-width: 360px; }
        .login-card .form-control { height: 46px; }
        @media (max-width: 767.98px) { .login { grid-template-columns: 1fr; } .login-arte { display: none; } }
    </style>
</head>
<body>
<div class="login">
    <section class="login-arte">
        <div class="marca p-0"><span class="marca-icone"><i class="bi bi-fire"></i></span><span>Pediu<b style="color:#ffd2c2">Patrão</b></span></div>
        <div>
            <h2>Do forno ao painel, tudo sob controle.</h2>
            <p>Pedidos, cardápio e indicadores da sua pizzaria em um só lugar.</p>
        </div>
        <small style="color:rgba(255,255,255,.6)">Sistema de pedidos · lanchonete &amp; pizzaria</small>
    </section>
    <section class="login-form">
        <div class="login-card">
            <img th:src="@{/images/logo.png}" alt="Logo" style="width:72px" class="mb-3">
            <h1 class="h3 fw-bold mb-1">Entrar</h1>
            <p class="texto-2 mb-4">Use seu usuário e senha da loja.</p>

            <div class="alert alert-danger py-2" th:if="${param.error}"><i class="bi bi-exclamation-triangle me-1"></i>Usuário ou senha inválidos.</div>
            <div class="alert alert-success py-2" th:if="${param.logout}"><i class="bi bi-check-circle me-1"></i>Você saiu do sistema.</div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuário</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="ex.: gerente" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Entrar <i class="bi bi-arrow-right ms-1"></i></button>
            </form>
        </div>
    </section>
</div>
</body>
</html>
