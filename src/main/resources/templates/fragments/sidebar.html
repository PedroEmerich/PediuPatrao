<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="sidebar" id="sidebar" th:fragment="sidebar">
    <a class="marca" th:href="@{/}">
        <span class="marca-icone"><i class="bi bi-fire"></i></span>
        <span>Pediu<b>Patrão</b></span>
    </a>

    <nav class="menu">
        <small class="menu-secao">Visão geral</small>
        <a class="menu-link" th:href="@{/dashboard}" th:if="${perfilLogado == 'ADMIN' or perfilLogado == 'GERENTE'}">
            <i class="bi bi-speedometer2"></i><span>Dashboard</span>
        </a>
        <a class="menu-link" th:href="@{/}" th:if="${perfilLogado == 'ATENDENTE'}">
            <i class="bi bi-house-door"></i><span>Início</span>
        </a>

        <small class="menu-secao">Operação</small>
        <a class="menu-link" th:href="@{/pedidos}"><i class="bi bi-receipt"></i><span>Pedidos</span></a>
        <a class="menu-link" th:href="@{/clientes}" th:if="${perfilLogado != 'ADMIN'}"><i class="bi bi-people"></i><span>Clientes</span></a>
        <a class="menu-link" th:href="@{/produtos}"><i class="bi bi-basket"></i><span>Produtos</span></a>

        <th:block th:if="${perfilLogado == 'ADMIN' or perfilLogado == 'GERENTE'}">
            <small class="menu-secao">Controle</small>
            <a class="menu-link" th:href="@{/auditoria}"><i class="bi bi-shield-check"></i><span>Auditoria</span></a>
            <a class="menu-link" th:href="@{/usuarios}" th:if="${perfilLogado == 'ADMIN'}"><i class="bi bi-person-gear"></i><span>Usuários</span></a>
        </th:block>
    </nav>

    <a class="menu-link sair" th:href="@{/logout}"><i class="bi bi-box-arrow-left"></i><span>Sair</span></a>
</aside>
</body>
</html>
